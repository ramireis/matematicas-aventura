plugins { id 'com.android.application' }

android {
    namespace 'ec.edu.matematicasvszombis'
    compileSdk 35

    defaultConfig {
        applicationId 'ec.edu.matematicasvszombis.estudiante.v415'
        minSdk 23
        targetSdk 35
        versionCode 40105
        versionName '4.1.5'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
