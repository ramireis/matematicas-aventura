name: Construir Lumi EDUFUSION Windows

# Compilacion remota de Lumi EDUFUSION 5.12
on:
  workflow_dispatch:
  push:
    paths:
      - 'edufusion-lumi/**'
      - '.github/workflows/build-lumi-windows.yml'

jobs:
  construir-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar archivos de Lumi
        shell: pwsh
        run: |
          foreach ($archivo in @('edufusion-lumi/index.html', 'edufusion-lumi/main.js', 'edufusion-lumi/package.json')) {
            if (-not (Test-Path $archivo)) { throw "Falta archivo real de Lumi: $archivo. Sube la carpeta edufusion-lumi antes de compilar." }
          }
      - name: Instalar dependencias
        working-directory: edufusion-lumi
        run: npm install
      - name: Crear ejecutable portable
        working-directory: edufusion-lumi
        run: npx --no-install electron-builder --win portable --x64 --publish never
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-EDUFUSION-Windows-EXE
          path: edufusion-lumi/dist/*.exe
          if-no-files-found: error
