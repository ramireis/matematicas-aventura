name: Build La Verdad con Matematicas EXE
on:
  workflow_dispatch:
  push:
    branches: [la-verdad-con-matematicas]
    paths: ['la-verdad-con-matematicas/**','.github/workflows/build-la-verdad.yml']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: la-verdad-con-matematicas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: La-Verdad-con-Matematicas-Windows
          path: la-verdad-con-matematicas/dist/*.exe
          if-no-files-found: error