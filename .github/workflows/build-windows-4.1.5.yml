name: Construir EXE Windows Estudiante 4.1.5
on:
  push:
    branches: [android-estudiante-4.1.0]
    paths:
      - package.json
      - electron-main.js
      - app/src/main/assets/www/**
      - .github/workflows/build-windows-4.1.5.yml
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Construir EXE portable
        shell: pwsh
        run: npm run dist:win
      - name: Verificar ejecutable
        shell: pwsh
        run: |
          $exe = "dist/Matematicas_vs_Zombis_ESTUDIANTE_4.1.5_WINDOWS_x64_PORTABLE.exe"
          if (!(Test-Path $exe)) { throw "No se genero el ejecutable" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "El ejecutable generado no es valido" }
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_ESTUDIANTE_4.1.5_WINDOWS_x64_PORTABLE
          path: dist/Matematicas_vs_Zombis_ESTUDIANTE_4.1.5_WINDOWS_x64_PORTABLE.exe
          if-no-files-found: error
          retention-days: 30
