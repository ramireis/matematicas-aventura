name: Construir Android 4.1.5 y Windows 4.1.9
on:
  push:
    branches: [android-estudiante-4.1.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK instalable
        run: gradle :app:assembleDebug --stacktrace
      - name: Renombrar entrega
        run: cp app/build/outputs/apk/debug/app-debug.apk Matematicas_vs_Zombis_ESTUDIANTE_4.1.5_INICIO_DIRECTO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_ESTUDIANTE_4.1.5_INICIO_DIRECTO
          path: Matematicas_vs_Zombis_ESTUDIANTE_4.1.5_INICIO_DIRECTO.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Construir carpeta ejecutable estable
        shell: pwsh
        run: npm run dist:win
      - name: Agregar instrucciones y verificar
        shell: pwsh
        run: |
          $folder = "dist/win-unpacked"
          $exe = "$folder/INICIAR_MATEMATICAS_VS_ZOMBIS.exe"
          if (!(Test-Path $exe)) { throw "No se genero el ejecutable" }
          if (!(Test-Path "$folder/resources/app.asar")) { throw "Faltan recursos del programa" }
          if (!(Test-Path "$folder/resources/www/index.html")) { throw "Falta index.html" }
          if (!(Test-Path "$folder/resources/www/qrcode.js")) { throw "Faltan recursos interactivos" }
          if ((Get-Item "$folder/resources/www/index.html").Length -lt 100000) { throw "El juego esta incompleto" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "El ejecutable no es valido" }
          "MATEMATICAS VS ZOMBIS 4.1.9" | Set-Content "$folder/LEAME_PRIMERO.txt"
          "1. Extraiga completamente el ZIP." | Add-Content "$folder/LEAME_PRIMERO.txt"
          "2. No mueva ni separe el archivo EXE de esta carpeta." | Add-Content "$folder/LEAME_PRIMERO.txt"
          "3. Ejecute INICIAR_MATEMATICAS_VS_ZOMBIS.exe." | Add-Content "$folder/LEAME_PRIMERO.txt"
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_ESTUDIANTE_4.1.9_WINDOWS_CARPETA_ESTABLE
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 30
