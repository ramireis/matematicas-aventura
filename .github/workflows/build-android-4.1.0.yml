name: Construir APK Android Estudiante 4.1.2
on:
  push:
    branches: [android-estudiante-4.1.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK instalable
        run: gradle :app:assembleDebug --stacktrace
      - name: Renombrar entrega
        run: cp app/build/outputs/apk/debug/app-debug.apk Matematicas_vs_Zombis_ESTUDIANTE_4.1.2_ANDROID_PANTALLAS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_ESTUDIANTE_4.1.2_ANDROID_PANTALLAS
          path: Matematicas_vs_Zombis_ESTUDIANTE_4.1.2_ANDROID_PANTALLAS.apk
          if-no-files-found: error
          retention-days: 30
