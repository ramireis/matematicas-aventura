name: Construir AAB Play Store Matemáticas vs Zombis

on:
  push:
    branches: ["nueva-construccion-zombis-apk"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compilar AAB
        working-directory: android_zombies
        run: gradle :app:bundleRelease --stacktrace
      - name: Preparar AAB
        run: cp android_zombies/app/build/outputs/bundle/release/app-release.aab Matematicas_vs_Zombis_EGB_sin_firma.aab
      - name: Publicar AAB para firma segura
        uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_EGB_AAB_sin_firma
          path: Matematicas_vs_Zombis_EGB_sin_firma.aab
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_zombies
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install
      - name: Construir instalador y portable
        run: npm run dist
      - name: Publicar archivos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_EGB_Windows
          path: windows_zombies/dist/*.exe
          retention-days: 30
