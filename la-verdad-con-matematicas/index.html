<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cazadores Matemáticos – 7mo EGB</title>
<link rel="stylesheet" href="./src/styles/split_layout.css">
</head>
<body>
<div id="start-screen" class="screen active">
  <div class="title-box">
    <img class="start-hero" src="./assets/hero.png" alt="Cazador matemático">
    <h1>CAZADORES MATEMÁTICOS<br><b>MISIÓN 7.º EGB</b></h1>
    <p>Combate, aprende y recupera tu energía con Matemáticas.</p>
    <button id="start-btn" class="primary">▶ INICIAR AVENTURA</button>
    <button id="worlds-btn">🗺 MUNDOS</button><button id="progress-btn">⭐ MI PROGRESO</button>
  </div>
</div>
<div id="world-screen" class="screen"><header><h2>MUNDOS MATEMÁTICOS</h2><button class="back">← Volver</button></header><div id="world-grid"></div></div>
<div id="play-screen" class="screen">
  <main id="split">
    <section id="game-panel">
      <div id="scene">
        <canvas id="gameCanvas"></canvas>
        <div id="asset-warning" class="hidden"></div>
        <div id="hero-hp"><b>CAZADOR</b><span><i></i></span><em>100%</em></div>
        <div id="enemy-hp"><b>DEMONIO</b><span><i></i></span><em>100%</em></div>
        <div id="battle-message">Preparando combate…</div>
        <div id="controls">← retroceder　→ avanzar　↓ esquivar　M saltar　ESPACIO atacar</div>
      </div>
    </section>
    <section id="activity-panel"><div id="activity-content"></div></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<script type="module" src="./src/main.js"></script>
</body></html>
